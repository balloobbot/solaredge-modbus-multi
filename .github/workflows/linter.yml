---
name: Lint Code Base
on:
  push:
  pull_request:
    branches:
      - main
permissions: read-all
jobs:
  build:
    name: Lint Code Base
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      statuses: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Lint Code Base
        uses: github/super-linter@v7
        env:
          VALIDATE_ALL_CODEBASE: false
          VALIDATE_JSCPD: false
          VALIDATE_PYTHON_MYPY: false
          VALIDATE_PYTHON_PYLINT: false
          VALIDATE_PYTHON_PYINK: false
          VALIDATE_PYTHON_BLACK: false
          # isort's own config lives in setup.cfg; without this super-linter
          # reads its bundled one, which drops the black profile and roots the
          # project outside the repo, so custom_components looks third-party.
          PYTHON_ISORT_CONFIG_FILE: setup.cfg
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
